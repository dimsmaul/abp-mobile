name: Build APK

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the APK to a Release on tag pushes

jobs:
  build:
    name: Build release APK (split per ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Flutter Android build needs a JDK on PATH.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      # Tag pushes are the source of truth for the release version. We
      # rewrite pubspec.yaml's `version:` line in-place so the APK reports
      # the correct versionName (and a monotonic versionCode from the
      # run number). Untagged pushes keep whatever is in pubspec.
      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          SEMVER="${REF_NAME#v}"
          NEW_VERSION="${SEMVER}+${RUN_NUMBER}"
          echo "Setting pubspec version to ${NEW_VERSION}"
          # Match the first `version:` line under the top-level (no
          # leading whitespace) and replace it. Keeps comments untouched.
          sed -i.bak -E "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          rm pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis (advisory)
        # Soft-fail so a single style nit doesn't block the build artifact.
        run: flutter analyze || true

      # Release build (AOT compiled, stripped) + split-per-abi so each APK
      # only ships the native libs for one architecture. A fat debug APK
      # was ~200MB; per-ABI release APKs typically land at 40-60MB each.
      # Skips dart symbol generation to keep the binary smaller.
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      # Rename the per-architecture APKs to advertise the version. Output
      # path Flutter uses: build/app/outputs/flutter-apk/app-<abi>-release.apk
      - name: Collect + rename APKs
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          tag_or_ref="$REF_NAME"
          if [[ "$tag_or_ref" != v* ]]; then
            tag_or_ref="${tag_or_ref}-${GITHUB_RUN_NUMBER}"
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [[ -f "$src" ]]; then
              cp "$src" "dist/fieldtrack-${tag_or_ref}-${abi}.apk"
            fi
          done
          ls -lh dist/

      # Surface a short summary so the run page shows the apk sizes at a
      # glance instead of having to download artifacts to check.
      # `github.ref_name` is attacker-controllable so it must NOT be
      # interpolated into the run script as a literal — pass it via env
      # var instead.
      - name: Inspect APKs
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## APK build"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Commit: $COMMIT_SHA"
            echo "Ref: $REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldtrack-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      # Tagged pushes get a permanent GitHub Release with all per-ABI APKs
      # attached. Most users want arm64-v8a; armeabi-v7a is for older
      # 32-bit phones, x86_64 is for emulators.
      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
